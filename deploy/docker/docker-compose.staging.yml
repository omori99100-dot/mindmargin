services:
  redis:
    image: redis:7-alpine
    volumes:
      - mindmargin_staging_redis_data:/data
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - mindmargin_staging_ollama_data:/root/.ollama
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: staging
      LOG_LEVEL: INFO
      DEBUG: "false"
    volumes:
      - ${MINDMARGIN_STAGING_ROOT:?MINDMARGIN_STAGING_ROOT must be set}/output:/app/output
      - ${MINDMARGIN_STAGING_ROOT:?MINDMARGIN_STAGING_ROOT must be set}/data:/app/data
    networks:
      - staging_internal
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: staging
      LOG_LEVEL: INFO
    volumes:
      - ${MINDMARGIN_STAGING_ROOT:?MINDMARGIN_STAGING_ROOT must be set}/output:/app/output
      - ${MINDMARGIN_STAGING_ROOT:?MINDMARGIN_STAGING_ROOT must be set}/data:/app/data
    networks:
      - staging_internal
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  mindmargin_staging_redis_data:
    name: mindmargin_staging_redis_data
  mindmargin_staging_ollama_data:
    name: mindmargin_staging_ollama_data

networks:
  staging_internal:
    name: mindmargin_staging_internal
    internal: true
